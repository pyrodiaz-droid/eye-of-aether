<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theia</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header id="toolbar">
      <span id="app-name">Theia</span>
      <button id="btn-new" title="New file (Ctrl+N)">New</button>
      <button id="btn-open" title="Open file (Ctrl+O)">Open</button>
      <button id="btn-mode" title="Toggle view/edit (Ctrl+E)">Edit</button>
      <button id="btn-save" title="Save (Ctrl+S)" disabled>Save</button>
      <span id="file-label" title="Dragging a .md file onto the window also opens it">Untitled</span>
      <span id="dirty-dot" hidden title="Unsaved changes">●</span>
    </header>
    <main id="pane">
      <article id="content" class="pane"></article>
      <textarea id="editor" class="pane" spellcheck="false" hidden></textarea>
    </main>
  </body>
</html>
