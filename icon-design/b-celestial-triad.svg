<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2c4f"/>
      <stop offset="1" stop-color="#0e1830"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.6" stop-color="#f0b84a"/>
      <stop offset="1" stop-color="#c98a22"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- horizon of dawn -->
  <path d="M96 372 Q 256 322 416 372" fill="none" stroke="#f2e8d5" stroke-width="11"
        stroke-linecap="round" opacity="0.65"/>

  <!-- Helios: rays -->
  <g stroke="#f0b84a" stroke-width="10" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="88"  x2="256" y2="58"/>
    <line x1="256" y1="148" x2="256" y2="178"/>
    <line x1="188" y1="118" x2="164" y2="98"/>
    <line x1="324" y1="118" x2="348" y2="98"/>
    <line x1="164" y1="158" x2="134" y2="150"/>
    <line x1="348" y1="158" x2="378" y2="150"/>
  </g>
  <!-- Helios -->
  <circle cx="256" cy="118" r="34" fill="url(#sun)"/>

  <!-- Selene: crescent -->
  <path d="M150 268 a 44 44 0 1 0 44 62 a 36 36 0 1 1 -44 -62 Z" fill="#f2e8d5" transform="rotate(-18 172 300)"/>

  <!-- Eos: rising on the horizon -->
  <path d="M322 372 a 34 34 0 0 1 68 0 Z" fill="#e58f7a"/>
  <line x1="306" y1="372" x2="406" y2="372" stroke="#e58f7a" stroke-width="10" stroke-linecap="round"/>
</svg>
