<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2c4f"/>
      <stop offset="1" stop-color="#0e1830"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.55" stop-color="#f0b84a"/>
      <stop offset="1" stop-color="#c98a22"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- rays of sight: 8 diagonals that stay inside the almond -->
  <g stroke="#f0b84a" stroke-width="11" stroke-linecap="round" opacity="0.9">
    <line x1="323.8" y1="217.4" x2="350.3" y2="207.1"/>
    <line x1="294.6" y1="188.2" x2="304.9" y2="161.7"/>
    <line x1="217.4" y1="188.2" x2="207.1" y2="161.7"/>
    <line x1="188.2" y1="217.4" x2="161.7" y2="207.1"/>
    <line x1="188.2" y1="294.6" x2="161.7" y2="304.9"/>
    <line x1="217.4" y1="323.8" x2="207.1" y2="350.3"/>
    <line x1="294.6" y1="323.8" x2="304.9" y2="350.3"/>
    <line x1="323.8" y1="294.6" x2="350.3" y2="304.9"/>
  </g>

  <!-- the eye of Theia -->
  <path d="M96 256 C 170 164 342 164 416 256 C 342 348 170 348 96 256 Z"
        fill="none" stroke="#f2e8d5" stroke-width="15" stroke-linejoin="round"/>
  <circle cx="256" cy="256" r="66" fill="url(#iris)"/>
  <circle cx="256" cy="256" r="26" fill="#12203e"/>
  <circle cx="272" cy="240" r="9" fill="#fff3d6"/>
</svg>
