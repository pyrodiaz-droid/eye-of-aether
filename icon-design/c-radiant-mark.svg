<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2c4f"/>
      <stop offset="1" stop-color="#0e1830"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.6" stop-color="#f0b84a"/>
      <stop offset="1" stop-color="#c98a22"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- light streaming down (markdown's down-arrow as a ray of aether) -->
  <g stroke="#f0b84a" stroke-width="10" stroke-linecap="round" opacity="0.85">
    <line x1="170" y1="96"  x2="146" y2="72"/>
    <line x1="342" y1="96"  x2="366" y2="72"/>
    <line x1="146" y1="170" x2="116" y2="178"/>
    <line x1="366" y1="170" x2="396" y2="178"/>
  </g>
  <circle cx="256" cy="124" r="44" fill="url(#disc)"/>

  <!-- the mark: shaft + chevron -->
  <g stroke="#f2e8d5" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="256" y1="208" x2="256" y2="366"/>
    <path d="M186 306 L 256 384 L 326 306"/>
  </g>
</svg>
