<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2c4f"/>
      <stop offset="1" stop-color="#0e1830"/>
    </linearGradient>
    <linearGradient id="facetA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#d99a2b"/>
    </linearGradient>
    <linearGradient id="facetB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0b84a"/>
      <stop offset="1" stop-color="#b07818"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- gem: crown + pavilion, facets catching her light -->
  <g stroke="#f2e8d5" stroke-width="9" stroke-linejoin="round" opacity="0.85">
    <path d="M176 148 L336 148 L404 244 L108 244 Z" fill="url(#facetA)"/>
    <path d="M108 244 L404 244 L256 428 Z" fill="url(#facetB)"/>
    <line x1="176" y1="148" x2="216" y2="244"/>
    <line x1="336" y1="148" x2="296" y2="244"/>
    <line x1="256" y1="148" x2="256" y2="244"/>
    <line x1="216" y1="244" x2="256" y2="428"/>
    <line x1="296" y1="244" x2="256" y2="428"/>
  </g>

  <!-- the sparkle she gives it -->
  <path d="M382 88 L392 118 L422 128 L392 138 L382 168 L372 138 L342 128 L372 118 Z"
        fill="#fff3d6"/>
